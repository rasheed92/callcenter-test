name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk callcenter-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callrec-debug-apk
          path: callcenter-test.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث APK — تطبيق الكول سنتر (تجربة)
          body: |
            نموذج اختبار تسجيل المكالمات. نزّل callcenter-test.apk وثبّته على الجهاز.
            انظر README لخطوات تفعيل إمكانية الوصول والصلاحيات.
          files: callcenter-test.apk
          make_latest: true
